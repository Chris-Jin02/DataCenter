xt x="407.0" y="367" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17233c">45</text><text x="190" y="404" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#17233c">Ohio</text><rect x="210" y="388" width="187.0" height="23" rx="2" fill="#6fa6c4"/><text x="407.0" y="405" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17233c">45</text><text x="190" y="442" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#17233c">Illinois</text><rect x="210" y="426" width="158.0" height="23" rx="2" fill="#6fa6c4"/><text x="378.0" y="443" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17233c">38</text><text x="190" y="480" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#17233c">Nevada</text><rect x="210" y="464" width="137.2" height="23" rx="2" fill="#6fa6c4"/><text x="357.2" y="481" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17233c">33</text><text x="190" y="518" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#17233c">Georgia</text><rect x="210" y="502" width="124.7" height="23" rx="2" fill="#6fa6c4"/><text x="344.7" y="519" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17233c">30</text><text x="190" y="556" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#17233c">New York</text><rect x="210" y="540" width="83.1" height="23" rx="2" fill="#6fa6c4"/><text x="303.1" y="557" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17233c">20</text>
