<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Two-by-two model benchmark design</title>
  <desc id="desc">Four experiments compare single-model fusion and factor-wise late fusion under regression and ordinal classification.</desc>
  <rect width="1000" height="590" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17233c">Primary Model Benchmark: 2 × 2 Design</text>
  <text x="500" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52627a">Training architecture × supervised task</text>

  <text x="360" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17233c">Single-model fusion</text>
  <text x="745" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17233c">Factor-wise late fusion</text>
  <text x="65" y="245" text-anchor="middle" transform="rotate(-90 65 245)" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17233c">Regression</text>
  <text x="65" y="445" text-anchor="middle" transform="rotate(-90 65 445)" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17233c">Ordinal classification</text>

  <rect x="155" y="145" width="410" height="170" rx="8" fill="#e8f1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="180" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2a6f97">E1 · Regression</text>
  <text x="180" y="218" font-family="Arial, sans-serif" font-size="15" fill="#17233c">15 core features</text>
  <text x="360" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#52627a">→</text>
  <text x="535" y="218" text-anchor="end" font-family="Arial, sans-serif" font-size="15" fill="#17233c">one regressor</text>
  <text x="360" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17233c">Output: y_score</text>
  <text x="360" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#52627a">Directly learns cross-factor relationships</text>

  <rect x="590" y="145" width="350" height="170" rx="8" fill="#fff3df" stroke="#e9a23b" stroke-width="2"/>
  <text x="615" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#9c6619">E2 · Regression</text>
  <text x="615" y="215" font-family="Arial, sans-serif" font-size="14" fill="#17233c">5 factor regressors → meta-model</text>
  <text x="765" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17233c">Output: y_score</text>
  <text x="765" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#52627a">Uses five out-of-fold subscores</text>

  <rect x="155" y="340" width="410" height="170" rx="8" fill="#e8f1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="180" y="375" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2a6f97">E3 · Ordinal classification</text>
  <text x="180" y="413" font-family="Arial, sans-serif" font-size="15" fill="#17233c">15 core features</text>
  <text x="360" y="413" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#52627a">→</text>
  <text x="535" y="413" text-anchor="end" font-family="Arial, sans-serif" font-size="15" fill="#17233c">one ordinal classifier</text>
  <text x="360" y="457" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17233c">Output: y_grade + probabilities</text>
  <text x="360" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#52627a">Grade 1 is best; K is selected in training folds</text>

  <rect x="590" y="340" width="350" height="170" rx="8" fill="#fff3df" stroke="#e9a23b" stroke-width="2"/>
  <text x="615" y="375" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#9c6619">E4 · Ordinal classification</text>
  <text x="615" y="410" font-family="Arial, sans-serif" font-size="14" fill="#17233c">5 factor classifiers → meta-model</text>
  <text x="765" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17233c">Output: y_grade</text>
  <text x="765" y="484" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#52627a">Uses 5 × K out-of-fold probabilities</text>

  <line x1="155" y1="545" x2="940" y2="545" stroke="#d9e0ea" stroke-width="1"/>
  <text x="547" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#52627a">All four experiments use identical nested spatial cross-validation splits and one locked geographic test set</text>
</svg>
