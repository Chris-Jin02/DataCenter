<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
  <title id="title">Composition of 951 inferred independent data center sites</title>
  <desc id="desc">A stacked bar showing 132 explicit campuses, 731 building-inferred sites, and 88 standalone points.</desc>
  <rect width="1000" height="410" fill="#ffffff"/>
  <text x="500" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17233c">Composition of the Inferred Site Inventory</text>
  <text x="500" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52627a">Default entity-resolution boundary · 951 mutually exclusive site IDs</text>

  <rect x="80" y="125" width="116.6" height="92" fill="#2a6f97"/>
  <rect x="196.6" y="125" width="645.7" height="92" fill="#e9a23b"/>
  <rect x="842.3" y="125" width="77.7" height="92" fill="#d95d39"/>
  <text x="138.3" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">132</text>
  <text x="138.3" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">13.9%</text>
  <text x="519.5" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#17233c">731</text>
  <text x="519.5" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#17233c">76.9%</text>
  <text x="881.2" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">88</text>
  <text x="881.2" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">9.3%</text>

  <circle cx="118" cy="279" r="8" fill="#2a6f97"/>
  <text x="137" y="284" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17233c">Explicit campuses</text>
  <text x="137" y="310" font-family="Arial, sans-serif" font-size="13" fill="#52627a">Source campus boundaries; high confidence</text>

  <circle cx="402" cy="279" r="8" fill="#e9a23b"/>
  <text x="421" y="284" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17233c">Building-inferred sites</text>
  <text x="421" y="310" font-family="Arial, sans-serif" font-size="13" fill="#52627a">Resolved from unmatched building records</text>

  <circle cx="680" cy="279" r="8" fill="#d95d39"/>
  <text x="699" y="284" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17233c">Standalone points</text>
  <text x="699" y="310" font-family="Arial, sans-serif" font-size="13" fill="#52627a">No campus or building match; low confidence</text>

  <line x1="80" y1="354" x2="920" y2="354" stroke="#d9e0ea" stroke-width="1"/>
  <text x="500" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#52627a">Entity-resolution estimate, not an official census</text>
</svg>
